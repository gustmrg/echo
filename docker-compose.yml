services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Data Source=/data/echo.db"
      Storage__Local__RootPath: "/data/files"
    volumes:
      - appdata:/data
    networks:
      - echo-network

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: echo
      RABBITMQ_DEFAULT_PASS: echo

volumes:
  appdata:

networks:
  echo-network:
    driver: bridge
