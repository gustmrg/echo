services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    user: "${ECHO_APP_UID:-1654}"
    environment:
      ConnectionStrings__DefaultConnection: "Data Source=/data/echo.db"
      Storage__Local__RootPath: "/data/files"
    depends_on:
      data-init:
        condition: service_completed_successfully
    volumes:
      - appdata:/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/echo.db"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - echo-network

  worker:
    build:
      context: ./apps/worker-ts
      dockerfile: Dockerfile
    user: "${ECHO_APP_UID:-1654}"
    environment:
      NODE_ENV: Development
      DB_PATH: /data/echo.db
      POLL_INTERVAL_MS: "${POLL_INTERVAL_MS:-5000}"
      JOB_TIMEOUT_MS: "${JOB_TIMEOUT_MS:-120000}"
      REFINEMENT_MODEL: "${REFINEMENT_MODEL:-}"
      REFINEMENT_BASE_URL: "${REFINEMENT_BASE_URL:-}"
      PROCESSING_LEASE_MS: "${PROCESSING_LEASE_MS:-900000}"
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_ROOT: /data/files
      TRANSCRIPTION_PROVIDER: "${TRANSCRIPTION_PROVIDER:-openrouter}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_BASE_URL: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
      OPENROUTER_TRANSCRIPTION_MODEL: "${OPENROUTER_TRANSCRIPTION_MODEL:-openai/gpt-4o-mini-transcribe}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    depends_on:
      data-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    volumes:
      - appdata:/data
    networks:
      - echo-network

  data-init:
    image: busybox:1.37
    command: ["sh", "-c", "mkdir -p /data/files && chmod -R 0777 /data"]
    volumes:
      - appdata:/data

volumes:
  appdata:

networks:
  echo-network:
    driver: bridge
