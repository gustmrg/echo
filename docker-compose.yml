services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    user: "${ECHO_APP_UID:-1654}"
    environment:
      ConnectionStrings__DefaultConnection: "Data Source=/data/echo.db"
      Storage__Provider: S3
      Storage__S3__BucketName: "${S3_BUCKET:-echo}"
      Storage__S3__Region: "${AWS_REGION:-us-east-1}"
      RabbitMQ__Url: "${RABBITMQ_URL:-amqp://echo:echo-dev-only@rabbitmq:5672}"
      RabbitMQ__JobQueue: "${RABBITMQ_JOB_QUEUE:-echo.jobs}"
      RabbitMQ__ResultQueue: "${RABBITMQ_RESULT_QUEUE:-echo.results}"
    depends_on:
      data-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    volumes:
      - appdata:/data
    networks: [echo-network]

  worker:
    build:
      context: ./apps/worker-ts
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      RABBITMQ_URL: "${RABBITMQ_URL:-amqp://echo:echo-dev-only@rabbitmq:5672}"
      RABBITMQ_JOB_QUEUE: "${RABBITMQ_JOB_QUEUE:-echo.jobs}"
      RABBITMQ_RESULT_QUEUE: "${RABBITMQ_RESULT_QUEUE:-echo.results}"
      JOB_TIMEOUT_MS: "${JOB_TIMEOUT_MS:-120000}"
      REFINEMENT_MODEL: "${REFINEMENT_MODEL:-}"
      REFINEMENT_BASE_URL: "${REFINEMENT_BASE_URL:-}"
      STORAGE_PROVIDER: s3
      S3_BUCKET: "${S3_BUCKET:-echo}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      TRANSCRIPTION_PROVIDER: "${TRANSCRIPTION_PROVIDER:-openrouter}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_BASE_URL: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
      OPENROUTER_TRANSCRIPTION_MODEL: "${OPENROUTER_TRANSCRIPTION_MODEL:-openai/gpt-4o-mini-transcribe}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [echo-network]

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-echo}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-echo-dev-only}"
    volumes: [rabbitdata:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [echo-network]

  data-init:
    image: busybox:1.37
    command: [sh, -c, 'chown ${ECHO_APP_UID:-1654} /data && chmod 0700 /data']
    volumes: [appdata:/data]

volumes:
  appdata:
  rabbitdata:
networks:
  echo-network:
    driver: bridge
