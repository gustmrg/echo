services:
  api:
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      data-init:
        condition: service_completed_successfully
    volumes:
      - ./apps/api:/src

  data-init:
    image: busybox:1.37
    command: ["sh", "-c", "mkdir -p /data/files && chmod -R 0777 /data"]
    volumes:
      - appdata:/data
