name: Workflow checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.5'
      - run: dotnet tool restore
      - run: dotnet test apps/api/Echo.slnx
      - run: pnpm install --frozen-lockfile
        working-directory: apps/worker-ts
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm build
        working-directory: apps/worker-ts
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm lint && pnpm test && pnpm build
        working-directory: apps/web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: docker compose -p echo-ci up -d --wait rabbitmq seaweedfs
      - run: ECHO_TEST_DOCKER_PROJECT=echo-ci pnpm test:integration
        working-directory: apps/worker-ts
      - run: pnpm test:e2e
        working-directory: apps/web
      - run: docker compose -p echo-ci down -v
        if: always()
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: apps/web/test-results
          if-no-files-found: ignore
